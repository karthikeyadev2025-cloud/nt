<!doctype html>

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: fetch the CSS with low priority via preload,
         then swap it to a real stylesheet once it arrives. Chrome DevTools'
         LCP trace flagged this as a 104ms render-blocking resource when
         loaded as a plain <link rel="stylesheet">; this pattern removes it
         from the critical rendering path entirely while still applying the
         real font as soon as it's ready (no FOUT beyond the normal
         font-display: swap behavior already requested via &display=swap). -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />

    <meta name="author" content="Nikki Technologies" />

    <!-- Regional alternates. Every English-speaking market gets its own
         hreflang pointing to the same URL — signals to Google we intentionally
         serve them all rather than being India-only. x-default catches
         everyone else. -->
    <link rel="alternate" hreflang="en" href="https://www.nikkitechnologies.com/" />
    <link rel="alternate" hreflang="en-IN" href="https://www.nikkitechnologies.com/" />
    <link rel="alternate" hreflang="en-AE" href="https://www.nikkitechnologies.com/" />
    <link rel="alternate" hreflang="en-GB" href="https://www.nikkitechnologies.com/" />

    <link rel="alternate" hreflang="en-SG" href="https://www.nikkitechnologies.com/" />
    <link rel="alternate" hreflang="en-AU" href="https://www.nikkitechnologies.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.nikkitechnologies.com/" />

    <!-- Legacy geo (Bing, Yandex still consume) -->
    <meta name="geo.region" content="IN-TG" />
    <meta name="geo.placename" content="Hyderabad, Telangana, Andhra Pradesh, South India" />
    <meta name="ICBM" content="17.3850, 78.4867" />

    <!-- Open Graph — MUST be present in initial HTML because WhatsApp,
         Facebook, LinkedIn, Slack, iMessage, and Signal all scrape without
         running JS. SEOHead.tsx updates these in-browser for SPA nav, but
         the first crawl reads what's here.

         WhatsApp specifically caches OG data for up to 30 days. If your
         image looks broken after this deploy, force a refresh via
         https://developers.facebook.com/tools/debug/ — this rescrapes and
         WhatsApp uses the same infrastructure. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nikki Technologies | Global Digital Marketing &amp; Custom Software" />
