<!doctype html>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: fetch the CSS with low priority via preload,
         then swap it to a real stylesheet once it arrives. Chrome DevTools'
         LCP trace flagged this as a 104ms render-blocking resource when
         loaded as a plain <link rel="stylesheet">; this pattern removes it
         from the critical rendering path entirely while still applying the
         real font as soon as it's ready (no FOUT beyond the normal
         font-display: swap behavior already requested via &display=swap). -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />

    <!-- Open Graph for Social & Search Engines -->
    <!-- og:/twitter: title+description match the live hero copy (Digital Media Hub
         • Software Studio), not the SEO-keyword title/description above — this is
         what a WhatsApp/Facebook/Twitter share preview card actually shows.
         Note: most link-preview bots (including WhatsApp's) read this static HTML
         directly and do not run the site's JS, so this file is the source of truth
         for share previews, separate from src/config/seo.ts which drives the
         in-browser <title>/meta tags after the app loads. Keep both in sync by hand
         if the hero copy changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nikki Technologies | Digital Media Hub • Software Studio" />
    <meta property="og:description" content="One technology partner for digital growth and software products. Trusted by businesses across India. A unit of K² Adexos Global Technologies." />
